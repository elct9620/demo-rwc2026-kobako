# The three sources as they actually arrive: only Facebook has no title, only
# YouTube has a thumbnail worth keeping, only KKTIX has a schedule. A test that
# reads across the lot needs all three shapes present.
#
# The dates are relative because "upcoming" is a comparison against now — fixed
# ones would quietly stop being upcoming a few weeks after they were written.

august_meetup:
  source: kktix
  external_id: "tag:rubytaiwan.kktix.cc,2005:Event/900001"
  title: "Ruby Taiwan 八月小聚"
  summary: "一起聊聊 Ruby 3.4 與 mruby 的近況"
  url: "https://rubytaiwan.kktix.cc/events/august-meetup"
  published_at: <%= 3.days.from_now.to_fs(:db) %>
  metadata: { "schedule": "2026/08/20 19:00 台北市中正區八德路" }

spring_conference:
  source: kktix
  external_id: "tag:rubytaiwan.kktix.cc,2005:Event/900002"
  title: "RubyConf Taiwan 春季場"
  summary: "年度研討會，兩天議程"
  url: "https://rubytaiwan.kktix.cc/events/spring-conference"
  published_at: <%= 60.days.ago.to_fs(:db) %>
  metadata: { "schedule": "2026/06/18 09:00 台北文創大樓" }

